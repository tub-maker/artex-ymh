name: build-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 从源码构建二开版镜像(Dockerfile.source 自包含构建:前端+Go+工具层)。
    # 不要用 autumn27/artex 官方镜像——那是上游原版,不含二开代码。
    build:
      context: .
      dockerfile: Dockerfile.source
    image: artex-ymh:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_HOST: ${ARTEX_HOST:-0.0.0.0}
      ARTEX_PORT: ${ARTEX_PORT:-8787}
      ARTEX_WORKERS: ${ARTEX_WORKERS:-4}
      ARTEX_LOG_LEVEL: ${ARTEX_LOG_LEVEL:-info}
      # 伪装门控入口固定，容器重建后地址不变（省略则首次随机、之后复用 data/gate.path）
      ARTEX_GATE_PATH: ${ARTEX_GATE_PATH:-}
      ARTEX_GATE_TTL_HOURS: ${ARTEX_GATE_TTL_HOURS:-168}
      # 移动端 SPA 挂载点（由 webuiHandler 以 /m/ 提供）
      ARTEX_MOBILE_DIR: /app/mobile
    ports:
      # cloudflared 的 origin 固定指向 127.0.0.1:8787，这里直连容器。
      # 伪装门控由 ARTeX 自身（server/gate.go）伪造 nginx 欢迎页实现，
      # 不需要、也不应该再叠一层真 nginx（那会泄露 Server: nginx/<版本>）。
      - "127.0.0.1:${ARTEX_PORT:-8787}:${ARTEX_PORT:-8787}"
      - "127.0.0.1:8788:8788"
    volumes:
      # 数据目录（sessions/transcripts/tasks/traffic 等）持久化。
      # 用命名卷而非匿名卷：重建容器不会丢数据。
      - appdata:/app/data
      # 签名密钥必须持久化，否则每次重建容器都会重新生成，
      # 导致所有已登录会话（含移动端 localStorage 里的 JWT）集体失效。
      - ${ARTEX_KEYS_DIR:-./keys}/jwt.key:/app/jwt.key
      - ${ARTEX_KEYS_DIR:-./keys}/gate.key:/app/gate.key
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
      # 移动端 SPA（artex-mobile 仓库的 dist）：挂载进容器由 /m/ 提供。
      # 好处：改移动端只需 `npm run build`，刷新手机即生效，不用重建镜像。
      - ${ARTEX_MOBILE_DIST:-../artex-mobile/dist}:/app/mobile:ro
    restart: unless-stopped

volumes:
  # 显式命名，避免 Docker 生成匿名卷导致"重建即丢数据"。
  # 实际卷名可用 .env 覆盖（迁移/多环境时用）。
  pgdata:
    name: ${ARTEX_PGDATA_VOLUME:-artex_pgdata}
  appdata:
    name: ${ARTEX_APPDATA_VOLUME:-artex_appdata}
